services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=copilot
      - MYSQL_PASSWORD=copilot123
      - MYSQL_DATABASE=study_copilot
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=study_copilot
      - MYSQL_USER=copilot
      - MYSQL_PASSWORD=copilot123
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
